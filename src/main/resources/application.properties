# ===============================
# Application Configuration
# ===============================
spring.application.name=Resume-analyser

# ===============================
# Database Configuration
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_crud_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:@*#Karan25}

# ===============================
# JPA / Hibernate Settings
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# API / Mail / Custom Keys
# ===============================
apiKey=${MAIL_KEY:dummy_brevo_key}
genKey=${GEN_KEY:AIzaSyDU5lxyPOvgVytWYBlRHAHxM6IpQLFcURU}

# ===============================
# File Upload Settings
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Connection Pool (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# Server Configuration
# ===============================
server.port=${PORT:8080}

# ===============================
# Logging Configuration
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN

# ===============================
# OAuth2 Client Credentials (Google)
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy_client_secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ===============================
# Adzuna Credentials
# ===============================
application-id=${ADZUNA_ID:dummy_adzuna_id}
application-api-key=${ADZUNA_KEY:dummy_adzuna_key}

# ===============================
# JWT Credentials (Must be >= 256 bits for HS256)
# ===============================
jwt-key=${JWT_KEY:ResumeAnalyserSecretKey2026Secure256BitTokenGenerator!}
